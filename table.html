<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Табличка</title>
    <style>
      tr {
        height: 100px;
      }
      td {
        width: 100px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <ul>
        <nav>
          <h1>Навігація</h1>
          <li>
            <a href="index.html"><h2>1 - Task</h2> </a>
          </li>
          <li>
            <a href="table.html"><h2>2 - Task</h2> </a>
          </li>
        </nav>
      </ul>
      <table border="1" width="1000">
        <caption>
          Таблиця
        </caption>
        <tr>
          <td rowspan="3" colspan="4">1</td>
          <td>2</td>
          <td>3</td>
        </tr>
        <tr>
          <td rowspan="2">4</td>
          <td rowspan="3">5</td>
        </tr>
        <tr></tr>
        <tr>
          <td colspan="4">6</td>
          <td>7</td>
        </tr>
      </table>
    </main>
  </body>
</html>
